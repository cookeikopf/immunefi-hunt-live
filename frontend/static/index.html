<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMU-OS</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --ink: #2b2620; --muted: #7a7265;
    --accent: #c0653a; --accent-soft: #f3e2d8; --ok: #3e7d4f; --warn: #b07b1e; --crit: #a83a32;
    --border: #e3ddd1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 36px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 24px; font-weight: 600; cursor: pointer; }
  header h1 em { color: var(--accent); font-style: italic; }
  header .sub { color: var(--muted); font-size: 14px; }
  header .spacer { flex: 1; }
  header .who { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 2px; padding: 0 36px; border-bottom: 1px solid var(--border); background: var(--card); overflow-x: auto; }
  nav a { text-decoration: none; font-size: 15px; padding: 11px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  nav a.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { padding: 26px 36px; max-width: 1150px; margin: 0 auto; }
  h2 { font-size: 18px; margin: 26px 0 12px; }
  h2:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card .value { font-size: 28px; margin-top: 5px; }
  .card .value.eur::after { content: " €"; font-size: 17px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 14.5px; }
  th { background: #faf8f3; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  form.panel, .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .frow { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 180px; flex: 1; }
  .field.wide { flex-basis: 100%; }
  .field label { font-size: 12.5px; color: var(--muted); }
  input, select, textarea { padding: 9px 11px; font: inherit; font-size: 14.5px; border: 1px solid var(--border); border-radius: 7px; background: #fffdf9; width: 100%; }
  textarea { min-height: 90px; resize: vertical; }
  button { font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  button.ghost { background: none; border: 1px solid var(--border); padding: 7px 14px; border-radius: 8px; color: var(--ink); }
  button.small { padding: 4px 10px; font-size: 13px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; }
  .pill.ok { background: #e2efe5; color: var(--ok); }
  .pill.warn { background: #f5ecd8; color: var(--warn); }
  .pill.crit { background: #f6e0de; color: var(--crit); }
  .finding { padding: 10px 14px; border-left: 4px solid var(--muted); background: var(--card); border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 15px; }
  .finding.kritisch { border-left-color: var(--crit); }
  .finding.warnung { border-left-color: var(--warn); }
  .finding.info { border-left-color: var(--ok); }
  .finding .area { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  #chat-log { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; min-height: 200px; max-height: 460px; overflow-y: auto; }
  .msg { margin-bottom: 14px; line-height: 1.5; }
  .msg.user { color: var(--accent); }
  .msg .who { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .msg pre { white-space: pre-wrap; font: inherit; margin: 4px 0 0; }
  .sources { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--crit); font-size: 14px; margin: 8px 0; }
  .success { color: var(--ok); font-size: 14px; margin: 8px 0; }
  .auth-wrap { max-width: 460px; margin: 60px auto; }
  .auth-wrap h1 { font-size: 30px; text-align: center; }
  .auth-wrap h1 em { color: var(--accent); font-style: italic; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; color: var(--muted); }
  .tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
  .matrix td, .matrix th { text-align: center; }
  .matrix td:first-child, .matrix th:first-child { text-align: left; }
  .row-actions { display: flex; gap: 6px; }
  pre.code { background: #faf8f3; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; overflow-x: auto; }
  #ai-suggestions { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; white-space: pre-wrap; line-height: 1.55; }
</style>
</head>
<body>
  <header id="header" style="display:none">
    <h1 onclick="location.hash='#/dashboard'">KMU-<em>OS</em></h1>
    <span class="sub" id="company"></span>
    <span class="pill" id="ai-status"></span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="ghost small" id="logout">Abmelden</button>
  </header>
  <nav id="nav" style="display:none"></nav>
  <main id="main"></main>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
